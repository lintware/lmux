[package]
name = "lmux-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "lmux native macOS client (egui/eframe)"
license = "MIT"

# Standalone crate: not a member of the root workspace (see root Cargo.toml exclude).
[workspace]

[dependencies]
lmux-proto = { path = "../crates/lmux-proto" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.36"
alacritty_terminal = "0.26"
ewebsock = "0.8"
portable-pty = "0.9"
zune-jpeg = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify-rust = "4"
dirs = "6"
log = "0.4"
# Terminal renderer (`gfx`): instance data for wgpu buffers.
bytemuck = { version = "1", features = ["derive"] }
# Antialiased paths for the characters the renderer draws itself (arcs, diagonals, Powerline).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
muda = { version = "0.20", default-features = false }

# The Dock badge (unread count), as cmux shows it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSPasteboard", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSError"] }
# Browser screenshots (`webview`): WKWebView's snapshot.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"
wry = "0.57.0"
# Terminal glyphs rasterized by CoreText, as Ghostty does.
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont", "CTFontDescriptor", "CTFontTraits", "CTFontManager", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGContext", "CGBitmapContext", "CGColorSpace", "CGFont", "CGImage", "CGDataProvider", "CGAffineTransform"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFString", "CFCGTypes", "CFDictionary", "CFArray", "CFNumber"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
