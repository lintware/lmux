[package]
name = "lmux-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "lmux native macOS client (egui/eframe)"
license = "MIT"

# Standalone crate: not a member of the root workspace (see root Cargo.toml exclude).
[workspace]

[dependencies]
lmux-proto = { path = "../crates/lmux-proto" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "persistence"] }
egui = "0.36"
alacritty_terminal = "0.26"
ewebsock = "0.8"
portable-pty = "0.9"
zune-jpeg = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify-rust = "4"
dirs = "6"
log = "0.4"

# The Dock badge (unread count), as cmux shows it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSError"] }
# Browser screenshots (`webview`): WKWebView's snapshot.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"
wry = "0.57.0"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
