[workspace]
resolver = "2"
members = ["crates/lmux-proto", "crates/lmux-core", "crates/lmux-browser", "crates/lmux"]
# The client is a standalone native GUI crate (different target, macOS-only).
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The server (my-server) has rustc 1.88; don't use newer language or std features.
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
lmux-proto = { path = "crates/lmux-proto" }
lmux-core = { path = "crates/lmux-core" }
lmux-browser = { path = "crates/lmux-browser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
