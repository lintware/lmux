[package]
name = "lmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lmux"
path = "src/main.rs"

[dependencies]
lmux-proto.workspace = true
lmux-core.workspace = true
# The binary is the only crate that may see both sides of the browser boundary.
lmux-browser.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false }
base64 = "0.22"
# TLS for the voice call: HTTPS and the sideband WebSocket to api.openai.com.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
